[package]
name = "auroragba-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Android JNI bindings for AuroraGBA"

[lib]
crate-type = ["cdylib"]

[dependencies]
auroragba-core = { path = "../core", features = ["save-states"] }
auroragba-link = { path = "../link" }
auroragba-shiny = { path = "../shiny" }
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"
