[package]
name = "auroragba-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop frontend for AuroraGBA"

[[bin]]
name = "auroragba"
path = "src/main.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[dependencies]
auroragba-core = { path = "../core", features = ["save-states"] }
auroragba-shiny = { path = "../shiny" }

log.workspace = true
env_logger.workspace = true
anyhow.workspace = true

eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
gilrs.workspace = true
cpal.workspace = true
ureq.workspace = true
image.workspace = true
rfd = "0.14"
