[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/link",
    "crates/desktop",
    "crates/shiny",
    "crates/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["thallanar <thallanargomes@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/thallanar/AuroraGBA"
rust-version = "1.75"

[workspace.dependencies]
# Logging
log = "0.4"
env_logger = "0.11"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Serialization (save states)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# UI (desktop)
eframe = "0.27"
egui = "0.27"

# Rendering / audio
wgpu = "0.19"
cpal = "0.15"

# Input
gilrs = "0.10"

# Biblioteca de ROMs: HTTP (box art do libretro) + decodificação de imagem
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

# Bitfield helpers (úteis para registradores do GBA)
bitflags = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1   # emulador é lento demais em opt-level=0
